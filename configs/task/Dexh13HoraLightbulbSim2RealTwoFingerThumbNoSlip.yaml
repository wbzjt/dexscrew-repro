name: Dexh13HoraLightbulb
physics_engine: ${..physics_engine}
on_evaluation: False
eval_cache_name: sim2real_twofinger_thumb_noslip

env:
  initPose: 'screwdriver_inclined'
  numEnvs: ${resolve_default:8192,${...num_envs}}
  numActions: 16
  apply_action_mask: True
  # Sim2Real two-finger cooperative variant.
  # Active DOFs/actions: index=0:3 and thumb=12:15.
  # Locked DOFs/actions: middle=4:7 and ring=8:11.
  action_mask_indices: [4, 5, 6, 7, 8, 9, 10, 11]
  envSpacing: 0.5

  episodeLength: 800
  aggregateMode: 1

  controller:
    torque_control: True
    controlFrequencyInv: 10
    pgain: 3
    # No-slip variant: lower authority and slightly higher damping so the
    # thumb cannot solve the task with a fast terminal flick.
    dgain: 0.015
    action_scale: 0.04
    torque_limit: 220.0

  rotation_axis: '+z'

  clipObservations: 5.0
  clipActions: 1.0
  reset_dist_threshold: 0.15
  reset_z_threshold: 0.0
  normalize_penalties_by_num_actions: True

  # Thumbpose02 stable setting: keep the thumb from using extreme posture as a
  # high-force shortcut while leaving enough range for useful rotation.
  pose_diff_penalty:
    thumb_weight: 0.3

  # Fingertip order: index=0, middle=1, ring=2, thumb=3.
  # Middle/ring are locked, so termination/proximity should evaluate only
  # the intended index+thumb grasp.
  finger_object_contact:
    thumb_fingertip_index: 3
    other_fingertip_indices: [0]

  # Diagnostic-only thumb slip/ejection markers. These feed TensorBoard/W&B
  # but do not change reward or termination.
  thumb_slip_diagnostics:
    contact_drop_w: 0.2
    far_dist: 0.082
    high_tip_speed: 0.16
    active_screw_vel: 0.2

  # Reward-side thumb stability guard for sim2real: discourage the thumb from
  # producing a high-impulse flick and then leaving the bulb at the stroke end.
  thumb_slip_penalty:
    enable: True
    thumb_fingertip_index: 3
    active_screw_vel: 0.2
    contact_force_min: 1.5
    contact_force_max: 4.0
    far_dist: 0.078
    high_tip_speed: 0.13
    high_tip_speed_span: 0.12
    scale_with_object: True
    contact_penalty_scale: -1.2
    far_penalty_scale: -1.5
    ejection_penalty_scale: -4.0
    after_drive_penalty_scale: -3.0
    terminal_ease_penalty_scale: -1.0
    terminal_ease_near_limit: 0.60
    terminal_ease_limit_span: 0.25
    terminal_ease_vel_clip: 0.9

  # Keep domain force perturbation, but soften it for the first anti-slip
  # run. Once the behavior is stable, raise it back toward the old 2.0/0.25.
  forceScale: 1.0
  randomForceProbScalar: 0.15
  forceDecay: 0.9
  forceDecayInterval: 0.08

  termination:
    grace_steps: 150
    enable_finger_dist: True
    enable_nut_stagnation: True
    enable_no_contact: True
    enable_screw_limit: True
    log: True

  hora:
    propHistoryLen: 30
    point_cloud_sampled_dim: 100

  reward:
    angvelClipMin: -4.0
    angvelClipMax: 4.0
    angvelPenaltyThres: [7.5, 15.0, 30000000, 60000000]
    rotate_reward_scale: 4.5
    pose_diff_penalty_scale: -2.0
    torque_penalty_scale: -45.0
    work_penalty_scale: -0.25
    rotate_penalty_scale: -0.45
    pc_z_dist_penalty_scale: -1.0
    proximity_reward_scale: 2.0
    fingertip_tangent_reward_scale: 0.6
    fingertip_torque_reward_scale: 0.3

  two_finger_gate:
    enable: True
    thumb_fingertip_index: 3
    # True two-finger gate: thumb + index only.
    other_fingertip_indices: [0]
    other_aggregation: max
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    # Strong sim2real gate: during positive rotation, single-finger flicking
    # should earn almost no rotate reward. Thumb and index must both stay near
    # the bulb and maintain contact force.
    min_mult: 0.0
    power: 3.0
    scale_with_object: True
    apply_positive_vel_only: True
    use_contact_force: True
    contact_force_min: 1.5
    contact_force_max: 4.0
    no_grasp_penalty_scale: -4.0

  fingertip_tangent_reward:
    enable: True
    # Co-active sim2real reward: both index and thumb must move along the
    # positive screw tangent. With min aggregation, a single active finger
    # receives almost no extra cooperative reward.
    fingertip_indices: [0, 3]
    aggregation: min
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    velocity_clip: 0.5
    scale_with_object: True
    positive_only: True
    use_contact_force: True
    contact_force_min: 1.5
    contact_force_max: 4.0

  fingertip_torque_reward:
    enable: True
    # Co-active torque reward: both active fingers need positive torque about
    # the bulb axis; one-finger flicking is filtered out by min aggregation.
    fingertip_indices: [0, 3]
    aggregation: min
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    torque_clip: 8.0
    scale_with_object: True
    positive_only: True
    force_sign: -1.0
    contact_force_min: 1.5
    contact_force_max: 4.0

  active_two_finger_contact:
    enable: True
    thumb_fingertip_index: 3
    other_fingertip_index: 0
    active_screw_vel: 0.2
    contact_force_min: 1.5
    contact_force_max: 4.0
    penalty_scale: -4.0

  opposition_grip_reward:
    enable: True
    thumb_fingertip_index: 3
    other_fingertip_index: 0
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    scale_with_object: True
    opposite_cos_min: 0.2
    contact_force_min: 1.5
    contact_force_max: 4.0
    force_sign: -1.0
    reward_scale: 0.7

  # Start from the current best scaled/positioned bulb geometry, but remove
  # middle/ring as active contributors for a stable thesis two-finger finish.
  baseObjScale: 1.20
  randomization:
    randomizeMass: True
    randomizeMassLower: 0.04
    randomizeMassUpper: 0.06
    randomizeCOM: True
    randomizeCOMLower: -0.001
    randomizeCOMUpper: 0.001
    randomizeFriction: True
    # Stable thesis contact range: avoid very low friction and high restitution
    # contacts that can make the thumb pop away after loading the bulb.
    randomizeFrictionLower: 1.0
    randomizeFrictionUpper: 5.0
    randomizeRestitutionLower: 0.0
    randomizeRestitutionUpper: 0.05
    randomizeScale: True
    randomize_hand_scale: False
    scaleListInit: True
    # Task code samples each listed center with roughly +/-0.025.
    # These centers therefore cover approximately 1.15-1.25.
    randomizeScaleList: [1.175, 1.225]
    randomizeScaleMin: 1.15
    randomizeScaleMax: 1.25
    randomizeScaleLower: 1.15
    randomizeScaleUpper: 1.25
    randomizePDGains: True
    randomizePGainLower: 2.7
    randomizePGainUpper: 3.3
    randomizeDGainLower: 0.014
    randomizeDGainUpper: 0.016
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0.0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True
    enable_obj_restitution: True
    enable_tactile: False
    contact_input_dim: 4
    contact_form: 'gpu_contact'
    contact_input: 'binary'
    contact_binarize_threshold: 0.1
    enable_obj_orientation: True
    enable_obj_linvel: True
    enable_obj_angvel: True
    enable_ft_pos: True
    enable_ft_orientation: True
    enable_ft_linvel: True
    enable_ft_angvel: True
    enable_hand_scale: True
    enable_nut_contact: True
    enable_nut_pos: True
    enable_nut_dof_vel: True
    enable_nut_dof_pos: True
    enable_screw_joint_friction: True
    enable_hand_position: False
    enable_hand_orientation: False
    enable_hand_joint_pos: False
    enable_pgain: False
    enable_dgain: False

  object:
    type: 'screw_contactviz'
    evalObjectType: null
    sampleProb: [1.0]
    init_pos: [0.012, -0.018, 0.0]
    init_pos_noise: [0.0, 0.0, 0.0]
    nut_termination_history_len: 60
    nut_stagnation_eps: 0.003
    screw_upper_limit: 628.3185
    thumb_range_limit: False
    object_tilt: False

  asset:
    handAsset: "assets/dexh13_hand/urdf/dexh13_hand_right_sim.urdf"
    fingertipBodies:
      - right_index_tip
      - right_middle_tip
      - right_ring_tip
      - right_thumb_tip
    handRootPos: [0.11, 0.020, 0.217]
    handRootRPY: [3.1415, 0.3, 3.1415]
    handRootPosZScaleComp: 0.06
    handRootPosNoise: [0.0, 0.0, 0.0]
    handInitPose:
      right_index_joint_0: 0.3426670736
      right_index_joint_1: 0.925279522
      right_index_joint_2: 0.2828971177
      right_index_joint_3: 1.1292990017
      right_middle_joint_0: 0.0
      right_middle_joint_1: 0.0
      right_middle_joint_2: 0.0
      right_middle_joint_3: 0.0
      right_ring_joint_0: 0.0
      right_ring_joint_1: 0.0
      right_ring_joint_2: 0.0
      right_ring_joint_3: 0.0
      right_thumb_joint_0: -0.3599407768
      right_thumb_joint_1: 1.5656383038
      right_thumb_joint_2: 0.220286703
      right_thumb_joint_3: 0.411966312
    dofLowerLimits: [-0.35, 0.0, 0.0, 0.0, -0.001, 0.0, 0.0, 0.0, -0.001, 0.0, 0.0, 0.0, -0.35, 0.0, 0.0, 0.0]
    dofUpperLimits: [0.35, 1.57, 1.57, 1.57, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.35, 1.57, 1.57, 1.57]

  enableCameraSensors: False

sim:
  dt: 0.005
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1
