name: Dexh13HoraLightbulb
physics_engine: ${..physics_engine}
on_evaluation: False
eval_cache_name: thesis_sim2real

env:
  initPose: 'screwdriver_inclined'
  numEnvs: ${resolve_default:8192,${...num_envs}}
  numActions: 16
  apply_action_mask: True
  # Active DOFs/actions: index=0:3 and thumb=12:15.
  # Locked DOFs/actions: middle=4:7 and ring=8:11.
  action_mask_indices: [4, 5, 6, 7, 8, 9, 10, 11]
  envSpacing: 0.5

  episodeLength: 800
  aggregateMode: 1

  controller:
    torque_control: True
    controlFrequencyInv: 10
    pgain: 3
    dgain: 0.01
    action_scale: 0.05
    torque_limit: 300.0

  rotation_axis: '+z'

  clipObservations: 5.0
  clipActions: 1.0
  reset_dist_threshold: 0.15
  reset_z_threshold: 0.0
  # Match original NutBolt-style penalty magnitudes: do not divide pose/torque/work
  # penalties by action dimension.
  normalize_penalties_by_num_actions: False

  # Match the original NutBolt-style behavior: no extra thumb-specific pose
  # weight beyond the normal pose_diff penalty.
  pose_diff_penalty:
    thumb_weight: 0.0

  # Fingertip order: index=0, middle=1, ring=2, thumb=3.
  # Middle/ring are locked, so termination/proximity evaluates index+thumb.
  finger_object_contact:
    thumb_fingertip_index: 3
    other_fingertip_indices: [0]
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    scale_with_object: True
    threshold_scale_with_object: True

  # Diagnostic-only markers; they do not change reward or termination.
  thumb_slip_diagnostics:
    contact_drop_w: 0.2
    far_dist: 0.09
    high_tip_speed: 0.25
    active_screw_vel: 0.2

  thumb_slip_penalty:
    enable: True
    thumb_fingertip_index: 3
    active_screw_vel: 0.15
    contact_force_min: 0.3
    contact_force_max: 2.0
    far_dist: 0.09
    scale_with_object: True
    contact_penalty_scale: -1.0
    far_penalty_scale: -0.5

  forceScale: 2.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08

  termination:
    grace_steps: 150
    enable_finger_dist: True
    enable_nut_stagnation: False
    enable_no_contact: False
    enable_screw_limit: False
    log: False

  hora:
    propHistoryLen: 30
    point_cloud_sampled_dim: 100

  reward:
    angvelClipMin: -4.0
    angvelClipMax: 2.5
    angvelPenaltyThres: 2.8
    # NutBolt-style reward/penalty scales.
    rotate_reward_scale: 6.0
    pose_diff_penalty_scale: -0.5
    torque_penalty_scale: -0.1
    work_penalty_scale: -0.01
    rotate_penalty_scale: -0.8
    pc_z_dist_penalty_scale: -1.0
    proximity_reward_scale: 2.0
    # NutBolt has no fingertip extra reward; keep the keys explicit at zero.
    fingertip_tangent_reward_scale: 0.0
    fingertip_torque_reward_scale: 0.0

  two_finger_gate:
    enable: True
    thumb_fingertip_index: 3
    other_fingertip_indices: [0]
    other_aggregation: max
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    min_mult: 0.02
    power: 1.0
    scale_with_object: True
    apply_positive_vel_only: True
    use_contact_force: True
    contact_force_min: 0.3
    contact_force_max: 2.0
    no_grasp_penalty_scale: -0.3

  # Extra fingertip rewards are disabled to match the original NutBolt reward
  # shape while keeping the config schema available for diagnostics.
  fingertip_tangent_reward:
    enable: False
    fingertip_indices: [0]
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    velocity_clip: 0.5
    scale_with_object: True
    positive_only: True
    use_contact_force: True
    contact_force_min: 0.3
    contact_force_max: 2.0

  fingertip_torque_reward:
    enable: False
    fingertip_indices: [0]
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    torque_clip: 8.0
    scale_with_object: True
    positive_only: True
    force_sign: -1.0
    contact_force_min: 0.3
    contact_force_max: 2.0

  # Train around the stable 1.20 bulb scale with runtime sampling near 1.15-1.25.
  baseObjScale: 1.20
  randomization:
    randomizeMass: True
    randomizeMassLower: 0.04
    randomizeMassUpper: 0.06
    randomizeCOM: True
    randomizeCOMLower: -0.001
    randomizeCOMUpper: 0.001
    randomizeFriction: True
    randomizeFrictionLower: 0.5
    randomizeFrictionUpper: 8.0
    randomizeScale: True
    randomize_hand_scale: False
    scaleListInit: True
    # Each listed scale is sampled with +/-0.025 in the task code.
    randomizeScaleList: [1.175, 1.225]
    randomizeScaleMin: 1.15
    randomizeScaleMax: 1.25
    randomizeScaleLower: 1.15
    randomizeScaleUpper: 1.25
    randomizePDGains: True
    randomizePGainLower: 2.7
    randomizePGainUpper: 3.3
    randomizeDGainLower: 0.009
    randomizeDGainUpper: 0.011
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0.0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True
    enable_obj_restitution: True
    enable_tactile: False
    contact_input_dim: 4
    contact_form: 'gpu_contact'
    contact_input: 'binary'
    contact_binarize_threshold: 0.1
    enable_obj_orientation: True
    enable_obj_linvel: True
    enable_obj_angvel: True
    enable_ft_pos: True
    enable_ft_orientation: True
    enable_ft_linvel: True
    enable_ft_angvel: True
    enable_hand_scale: True
    enable_nut_contact: True
    enable_nut_pos: True
    enable_nut_dof_vel: True
    enable_nut_dof_pos: True
    enable_screw_joint_friction: True
    enable_hand_position: False
    enable_hand_orientation: False
    enable_hand_joint_pos: False
    enable_pgain: False
    enable_dgain: False

  object:
    type: 'screw_contactviz'
    evalObjectType: null
    sampleProb: [1.0]
    init_pos: [0.012, -0.018, 0.0]
    init_pos_noise: [0.005, 0.005, 0.0]
    nut_termination_history_len: 60
    nut_stagnation_eps: 0.003
    screw_upper_limit: 628.3185
    thumb_range_limit: False
    object_tilt: False

  asset:

    handAsset: "assets/dexh13_hand/urdf/dexh13_hand_right_sim.urdf"
    fingertipBodies:
      - right_index_tip
      - right_middle_tip
      - right_ring_tip
      - right_thumb_tip
    handRootPos: [0.086000, 0.014000, 0.243000]
    handRootRPY: [3.141500, 0.422173, 3.141500]
    handRootPosZScaleComp: 0.06
    handRootPosNoise: [0.0, 0.0, 0.0]
    handInitPose:
      right_index_joint_0: 0.0000000000
      right_index_joint_1: 0.9852794409
      right_index_joint_2: 0.2828971148
      right_index_joint_3: 0.2892995179
      right_middle_joint_0: 0.0010000000
      right_middle_joint_1: 0.0000000000
      right_middle_joint_2: 0.0000000000
      right_middle_joint_3: 0.0000000000
      right_ring_joint_0: 0.0000000000
      right_ring_joint_1: 0.0000000000
      right_ring_joint_2: 0.0000000000
      right_ring_joint_3: 0.0000000000
      right_thumb_joint_0: 0.0000000000
      right_thumb_joint_1: 1.5700000525
      right_thumb_joint_2: 0.0000000000
      right_thumb_joint_3: 0.9119660854
    dofLowerLimits: [-0.34, 0.0, 0.0, 0.0, -0.001, 0.0, 0.0, 0.0, -0.001, 0.0, 0.0, 0.0, -0.34, 0.0, 0.0, 0.0]
    dofUpperLimits: [0.34, 1.57, 1.57, 1.57, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.34, 1.57, 1.57, 1.57]

  enableCameraSensors: False

sim:
  dt: 0.005
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1
