name: Dexh13HoraLightbulb
physics_engine: ${..physics_engine}
on_evaluation: False
eval_cache_name: middle_scalepos

env:
  initPose: 'screwdriver_inclined'
  numEnvs: ${resolve_default:8192,${...num_envs}}
  numActions: 16
  apply_action_mask: True
  # Freeze policy actions for the ring finger in this probe.
  # DOF/action order: index=0:3, middle=4:7, ring=8:11, thumb=12:15.
  action_mask_indices: [8, 9, 10, 11]
  envSpacing: 0.5

  episodeLength: 800
  aggregateMode: 1

  controller:
    torque_control: True
    controlFrequencyInv: 10
    pgain: 3
    dgain: 0.01
    action_scale: 0.05
    torque_limit: 300.0

  rotation_axis: '+z'

  clipObservations: 5.0
  clipActions: 1.0
  reset_dist_threshold: 0.15
  reset_z_threshold: 0.0
  normalize_penalties_by_num_actions: True

  # Align proximity reward and finger-distance termination with the soft
  # three-finger probe. Fingertip order: index=0, middle=1, ring=2, thumb=3.
  finger_object_contact:
    thumb_fingertip_index: 3
    other_fingertip_indices: [0, 1]

  forceScale: 2.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08

  termination:
    grace_steps: 50
    enable_finger_dist: False
    enable_nut_stagnation: False
    enable_no_contact: False
    enable_screw_limit: False
    log: False

  hora:
    propHistoryLen: 30
    point_cloud_sampled_dim: 100

  reward:
    angvelClipMin: -4.0
    angvelClipMax: 4.0
    angvelPenaltyThres: [7.5, 15.0, 30000000, 60000000]
    rotate_reward_scale: 2.5
    pose_diff_penalty_scale: -1.5
    torque_penalty_scale: -30.0
    work_penalty_scale: -0.15
    rotate_penalty_scale: -0.3
    pc_z_dist_penalty_scale: -1.0
    proximity_reward_scale: 2.0
    fingertip_tangent_reward_scale: 0.6
    fingertip_torque_reward_scale: 0.3

  two_finger_gate:
    enable: True
    thumb_fingertip_index: 3
    # Soft three-finger gate: thumb must participate while index+middle are
    # encouraged together, with stronger pressure on the weaker of index/middle.
    other_fingertip_indices: [0, 1]
    other_aggregation: mean_min
    other_mean_weight: 0.2
    other_min_weight: 0.8
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    min_mult: 0.05
    power: 1.0
    scale_with_object: True
    apply_positive_vel_only: True
    use_contact_force: True
    contact_force_min: 0.3
    contact_force_max: 2.0
    no_grasp_penalty_scale: -0.3

  fingertip_tangent_reward:
    enable: True
    # Fingertip order: index=0, middle=1, ring=2, thumb=3.
    # This bonus asks middle to move along the positive screw tangent while
    # near/contacting the bulb, instead of merely touching it.
    fingertip_indices: [1]
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    velocity_clip: 0.5
    scale_with_object: True
    positive_only: True
    use_contact_force: True
    contact_force_min: 0.3
    contact_force_max: 2.0

  fingertip_torque_reward:
    enable: True
    # Fingertip order: index=0, middle=1, ring=2, thumb=3.
    # Approximate middle's contribution to bulb rotation from contact force:
    # torque = cross(fingertip - bulb_center, force_on_bulb) dot +z.
    fingertip_indices: [1]
    target: nut_pos
    target_offset: [0.0, 0.0, 0.04]
    near: 0.08
    far: 0.13
    torque_clip: 8.0
    scale_with_object: True
    positive_only: True
    # Isaac net contact force is force on the fingertip, so -1 approximates
    # the reaction force applied by the fingertip onto the bulb.
    force_sign: -1.0
    contact_force_min: 0.3
    contact_force_max: 2.0

  # Geometry probe: enlarge the lightbulb collision/visual mesh uniformly and
  # shift the bulb slightly toward the thumb side. The hand z position below is
  # compensated by the same 0.06 * (scale - 1.0) rule used during scale
  # randomization, but fixed here so the probe isolates one geometry.
  baseObjScale: 1.20
  randomization:
    randomizeMass: True
    randomizeMassLower: 0.04
    randomizeMassUpper: 0.06
    randomizeCOM: True
    randomizeCOMLower: -0.001
    randomizeCOMUpper: 0.001
    randomizeFriction: True
    randomizeFrictionLower: 0.5
    randomizeFrictionUpper: 8.0
    randomizeScale: False
    randomize_hand_scale: False
    scaleListInit: True
    randomizeScaleList: [1.20]
    randomizeScaleMin: 1.20
    randomizeScaleMax: 1.20
    randomizeScaleLower: 1.20
    randomizeScaleUpper: 1.20
    randomizePDGains: True
    randomizePGainLower: 2.7
    randomizePGainUpper: 3.3
    randomizeDGainLower: 0.009
    randomizeDGainUpper: 0.011
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0.0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True
    enable_obj_restitution: True
    enable_tactile: False
    contact_input_dim: 4
    contact_form: 'gpu_contact'
    contact_input: 'binary'
    contact_binarize_threshold: 0.1
    enable_obj_orientation: True
    enable_obj_linvel: True
    enable_obj_angvel: True
    enable_ft_pos: True
    enable_ft_orientation: True
    enable_ft_linvel: True
    enable_ft_angvel: True
    enable_hand_scale: True
    enable_nut_contact: True
    enable_nut_pos: True
    enable_nut_dof_vel: True
    enable_nut_dof_pos: True
    enable_screw_joint_friction: True
    enable_hand_position: False
    enable_hand_orientation: False
    enable_hand_joint_pos: False
    enable_pgain: False
    enable_dgain: False

  object:
    type: 'screw_contactviz'
    evalObjectType: null
    sampleProb: [1.0]
    init_pos: [0.012, -0.018, 0.0]
    init_pos_noise: [0.0, 0.0, 0.0]
    nut_termination_history_len: 60
    nut_stagnation_eps: 0.003
    screw_upper_limit: 628.3185
    thumb_range_limit: False
    object_tilt: False

  asset:
    handAsset: "assets/dexh13_hand/urdf/dexh13_hand_right_sim.urdf"
    fingertipBodies:
      - right_index_tip
      - right_middle_tip
      - right_ring_tip
      - right_thumb_tip
    handRootPos: [0.11, 0.020, 0.217]
    handRootRPY: [3.1415, 0.3, 3.1415]
    handRootPosZScaleComp: 0.06
    handRootPosNoise: [0.0, 0.0, 0.0]
    handInitPose:
      right_index_joint_0: 0.3426670736
      right_index_joint_1: 0.925279522
      right_index_joint_2: 0.2828971177
      right_index_joint_3: 1.1292990017
      right_middle_joint_0: 0.0088817632
      right_middle_joint_1: 0.6302785110
      right_middle_joint_2: 0.8105450249
      right_middle_joint_3: 0.8256424212
      right_ring_joint_0: 0.0
      right_ring_joint_1: 0.0
      right_ring_joint_2: 0.0
      right_ring_joint_3: 0.0
      right_thumb_joint_0: -0.3599407768
      right_thumb_joint_1: 1.5656383038
      right_thumb_joint_2: 0.220286703
      right_thumb_joint_3: 0.411966312
    dofLowerLimits: [-0.35, 0.0, 0.0, 0.0, -0.35, 0.0, 0.0, 0.0, -0.001, 0.0, 0.0, 0.0, -0.35, 0.0, 0.0, 0.0]
    dofUpperLimits: [0.35, 1.57, 1.57, 1.57, 0.35, 1.57, 1.57, 1.57, 0.001, 0.001, 0.001, 0.001, 0.35, 1.57, 1.57, 1.57]

  enableCameraSensors: False

sim:
  dt: 0.005
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1
