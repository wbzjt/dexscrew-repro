    normalize_value: true
    normalize_priv: true
    normalize_point_cloud: true
    value_bootstrap: true
    num_actors: ${...task.env.numEnvs}
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.005
    kl_threshold: 0.02
    horizon_length: 12
    minibatch_size: 576
    mini_epochs: 5
    clip_value: true
    critic_coef: 4
    entropy_coef: 0.0
    e_clip: 0.2
    bounds_loss_coef: 0.0
